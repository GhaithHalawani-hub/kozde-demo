<html lang="tr">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c1512; --ink-2: #4a3f39; --muted: #8a7c73; --cream: #f8f1e7; --paper: #fffaf3;
    --ember: #d9481f; --ember-2: #b8360f; --line: #e8dccd; --green: #1f8a4c;
    --radius: 16px; --display: "DM Serif Display", Georgia, serif; --body: "Inter", system-ui, sans-serif;
  }
  [dir="rtl"] { --display: "Cairo", sans-serif; --body: "Cairo", sans-serif; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; overflow-x: clip; }
  body { margin: 0; font: 16px/1.55 var(--body); color: var(--ink); background: var(--paper); -webkit-font-smoothing: antialiased; }
  img { display: block; max-width: 100%; }
  a { color: inherit; }
  .wrap { width: min(1120px, 100% - 32px); margin-inline: auto; }

  /* ---------- Top bar ---------- */
  header.top { position: fixed; inset: 0 0 auto; z-index: 50; transition: background .25s, box-shadow .25s; }
  header.top.solid { background: rgba(255,250,243,.94); backdrop-filter: blur(10px); box-shadow: 0 1px 0 var(--line); }
  .bar { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .logo { font: 26px/1 var(--display); color: #fff; text-decoration: none; letter-spacing: .3px; }
  .solid .logo { color: var(--ink); }
  .logo span { color: var(--ember); }
  .langs { display: flex; gap: 2px; background: rgba(255,255,255,.16); border-radius: 999px; padding: 3px; }
  .solid .langs { background: var(--cream); }
  .langs button { border: 0; background: none; color: #fff; font: 600 13px var(--body); padding: 6px 11px; border-radius: 999px; cursor: pointer; }
  .solid .langs button { color: var(--ink-2); }
  .langs button.on { background: #fff; color: var(--ink); }
  .solid .langs button.on { background: var(--ink); color: #fff; }

  /* ---------- Hero ---------- */
  .hero { position: relative; min-height: 92svh; display: flex; align-items: flex-end; color: #fff; overflow: hidden; }
  .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.04); }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,12,8,.55) 0%, rgba(20,12,8,.15) 35%, rgba(20,12,8,.88) 100%); }
  .hero .wrap { position: relative; z-index: 1; padding-bottom: 56px; }
  .status { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; background: rgba(0,0,0,.35); padding: 6px 12px; border-radius: 999px; backdrop-filter: blur(6px); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #9aa; }
  .open .dot { background: #3ddc84; box-shadow: 0 0 0 4px rgba(61,220,132,.25); }
  .hero h1 { font: clamp(46px, 9vw, 92px)/1 var(--display); margin: 18px 0 12px; max-width: 12ch; }
  [dir="rtl"] .hero h1 { font-weight: 700; line-height: 1.15; }
  .hero p.lead { font-size: clamp(17px, 2.2vw, 20px); max-width: 46ch; opacity: .92; margin: 0 0 26px; }
  .meta { display: flex; gap: 18px; flex-wrap: wrap; font-size: 14px; opacity: .9; margin-bottom: 26px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 8px; border: 0; cursor: pointer; text-decoration: none; font: 600 15px var(--body);
    padding: 14px 20px; border-radius: 999px; transition: transform .15s, background .15s; }
  .btn:active { transform: scale(.97); }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .btn-wa { background: #25d366; color: #0b3d1f; }
  .btn-wa:hover { background: #2ee472; }
  .btn-ghost { background: rgba(255,255,255,.14); color: #fff; backdrop-filter: blur(6px); }
  .btn-ghost:hover { background: rgba(255,255,255,.24); }
  .btn-dark { background: var(--ink); color: #fff; }

  /* ---------- Sections ---------- */
  section { padding: 84px 0; }
  .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ember); margin: 0 0 10px; }
  [dir="rtl"] .eyebrow { letter-spacing: 0; }
  h2 { font: clamp(34px, 5vw, 50px)/1.08 var(--display); margin: 0 0 16px; }
  [dir="rtl"] h2 { font-weight: 700; line-height: 1.3; }

  .story { display: grid; grid-template-columns: 1.1fr 1fr; gap: 56px; align-items: center; }
  .story p { color: var(--ink-2); font-size: 17px; }
  .story .pics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .story .pics img { border-radius: var(--radius); aspect-ratio: 3/4; object-fit: cover; width: 100%; }
  .story .pics img:last-child { margin-top: 40px; }
  .facts { display: flex; gap: 32px; margin-top: 28px; flex-wrap: wrap; }
  .facts b { display: block; font: 34px/1 var(--display); color: var(--ember); }
  .facts span { font-size: 14px; color: var(--muted); }

  /* ---------- Menu ---------- */
  #menu { background: var(--cream); }
  .menu-head { display: flex; justify-content: space-between; align-items: end; gap: 20px; flex-wrap: wrap; margin-bottom: 26px; }
  .tabs { position: sticky; top: 64px; z-index: 20; background: var(--cream); display: flex; gap: 8px; overflow-x: auto; padding: 12px 0; margin-bottom: 18px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { flex: none; border: 1px solid var(--line); background: var(--paper); color: var(--ink-2); font: 600 14px var(--body); padding: 9px 16px; border-radius: 999px; cursor: pointer; }
  .tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .cat { scroll-margin-top: 140px; margin-bottom: 40px; }
  .cat h3 { font: 26px var(--display); margin: 0 0 14px; }
  [dir="rtl"] .cat h3 { font-weight: 700; }
  .items { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .item { display: flex; gap: 14px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; align-items: center; }
  .item img { width: 96px; height: 96px; border-radius: 12px; object-fit: cover; flex: none; }
  .item .info { flex: 1; min-width: 0; }
  .item h4 { margin: 0 0 2px; font-size: 16px; font-weight: 700; }
  .item p { margin: 0 0 8px; font-size: 13.5px; color: var(--muted); line-height: 1.4; }
  .item .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .price { font-weight: 700; font-size: 16px; }
  .tag { font-size: 11px; font-weight: 700; color: var(--ember); background: #fde6dc; padding: 2px 8px; border-radius: 999px; margin-inline-start: 6px; vertical-align: 2px; }
  .qty { display: flex; align-items: center; gap: 2px; }
  .qty button { width: 34px; height: 34px; border-radius: 50%; border: 0; cursor: pointer; font: 600 18px var(--body); background: var(--ink); color: #fff; display: grid; place-items: center; }
  .qty button.minus { background: var(--cream); color: var(--ink); }
  .qty output { min-width: 24px; text-align: center; font-weight: 700; }
  .qty [hidden], #addrWrap[hidden] { display: none; }

  /* ---------- Gallery ---------- */
  .gallery { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 200px; gap: 12px; margin-top: 26px; }
  .gallery img { width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius); }
  .gallery img:nth-child(1) { grid-column: span 2; grid-row: span 2; }

  /* ---------- Reviews ---------- */
  .reviews { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 26px; }
  .review { background: var(--cream); border-radius: var(--radius); padding: 22px; }
  .stars { color: #f5a623; letter-spacing: 2px; }
  .review p { margin: 10px 0 14px; color: var(--ink-2); }
  .review b { font-size: 14px; }

  /* ---------- Visit ---------- */
  #visit { background: var(--ink); color: #fff; }
  #visit .grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 40px; align-items: stretch; }
  .hours { list-style: none; padding: 0; margin: 20px 0 28px; }
  .hours li { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.12); }
  .hours li.today { color: #ffb08f; font-weight: 700; }
  .addr { color: rgba(255,255,255,.75); margin: 0 0 20px; }
  .map { border-radius: var(--radius); overflow: hidden; min-height: 360px; background: #2a211c; }
  .map iframe { width: 100%; height: 100%; min-height: 360px; border: 0; filter: grayscale(.25); }
  footer { background: var(--ink); color: rgba(255,255,255,.55); font-size: 13px; padding: 24px 0 110px; border-top: 1px solid rgba(255,255,255,.1); }
  footer .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

  /* ---------- Cart bar + sheet ---------- */
  .cartbar { position: fixed; z-index: 60; inset: auto 16px 16px; max-width: 560px; margin-inline: auto; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; background: var(--ink); color: #fff; padding: 10px 10px 10px 20px; border-radius: 999px; box-shadow: 0 12px 30px rgba(0,0,0,.3);
    transform: translateY(140%); transition: transform .3s cubic-bezier(.2,.9,.3,1.2); }
  [dir="rtl"] .cartbar { padding: 10px 20px 10px 10px; }
  .cartbar.show { transform: none; }
  .cartbar .sum { font-weight: 600; }
  .cartbar .sum small { display: block; font-weight: 400; opacity: .7; font-size: 12px; }
  .sheet-bg { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .25s; }
  .sheet-bg.show { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; z-index: 80; inset: auto 0 0; max-width: 560px; margin-inline: auto; background: var(--paper); border-radius: 22px 22px 0 0; padding: 22px 20px 20px;
    max-height: 86svh; overflow-y: auto; transform: translateY(100%); transition: transform .3s ease; }
  .sheet.show { transform: none; }
  .sheet h3 { font: 26px var(--display); margin: 0 0 12px; }
  [dir="rtl"] .sheet h3 { font-weight: 700; }
  .lines { list-style: none; padding: 0; margin: 0 0 14px; }
  .lines li { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .lines .n { color: var(--muted); }
  .total { display: flex; justify-content: space-between; font-weight: 700; font-size: 18px; margin: 4px 0 16px; }
  .sheet label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
  .sheet input, .sheet textarea { width: 100%; font: inherit; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; margin-bottom: 12px; }
  .seg { display: flex; gap: 6px; margin-bottom: 12px; }
  .seg button { flex: 1; padding: 11px; border: 1px solid var(--line); background: #fff; border-radius: 12px; font: 600 14px var(--body); cursor: pointer; }
  .seg button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .sheet .btn { width: 100%; justify-content: center; }
  .x { float: inline-end; border: 0; background: var(--cream); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 16px; }

  .demo { position: fixed; z-index: 55; top: 72px; inset-inline-end: 12px; font: 600 11px var(--body); background: #fff3; color: #fff; padding: 4px 9px; border-radius: 999px; backdrop-filter: blur(6px); letter-spacing: .05em; }
  .solid ~ .demo { display: none; }

  @media (max-width: 860px) {
    section { padding: 64px 0; }
    .story, #visit .grid { grid-template-columns: 1fr; gap: 32px; }
    .items { grid-template-columns: 1fr; }
    .reviews { grid-template-columns: 1fr; }
    .gallery { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 150px; }
  }
  @media (max-width: 420px) {
    .item img { width: 80px; height: 80px; }
    .actions .btn { flex: 1 1 auto; justify-content: center; }
  }
</style>
</head>

/* ================================================================ */
const LANGS = ['tr', 'ar', 'en'];
let L = 0;
try { const s = localStorage.getItem('lang'); if (LANGS.includes(s)) L = LANGS.indexOf(s); } catch {}
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const t = (k, vars = {}) => T[k][L].replace(/\{(\w+)\}/g, (_, v) => vars[v]);
const money = n => n.toLocaleString('tr-TR') + ' ' + CONFIG.currency;
const cart = {};
let mode = 'delivery';

function render() {
  document.documentElement.lang = LANGS[L];
  document.documentElement.dir = L === 1 ? 'rtl' : 'ltr';
  $$('.langs button').forEach((b, i) => b.classList.toggle('on', i === L));
  $$('[data-t]').forEach(el => { const k = el.dataset.t; if (T[k]) el.textContent = T[k][L]; });

  $('#tabs').innerHTML = MENU.map((c, i) => `<button data-cat="${c.id}" class="${i ? '' : 'on'}">${c.name[L]}</button>`).join('');
  $('#menuList').innerHTML = MENU.map(c => `
    <div class="cat" id="cat-${c.id}"><h3>${c.name[L]}</h3><div class="items">
      ${c.items.map(it => `
        <article class="item">
          ${it.img ? `<img src="${it.img}" alt="" loading="lazy">` : ''}
          <div class="info">
            <h4>${it.name[L]}${it.tag ? `<span class="tag">${t('popular')}</span>` : ''}</h4>
            ${it.desc[L] ? `<p>${it.desc[L]}</p>` : ''}
            <div class="row"><span class="price">${money(it.price)}</span>
              <div class="qty" data-id="${it.id}">
                <button class="minus" aria-label="-" ${cart[it.id] ? '' : 'hidden'}>−</button>
                <output ${cart[it.id] ? '' : 'hidden'}>${cart[it.id] || 0}</output>
                <button class="plus" aria-label="+">+</button>
              </div></div>
          </div>
        </article>`).join('')}
    </div></div>`).join('');

  $('#reviewList').innerHTML = REVIEWS.map(r => `<div class="review"><div class="stars">★★★★★</div><p>“${r.text[L]}”</p><b>${r.who}</b></div>`).join('');
  const today = new Date().getDay();
  $('#hours').innerHTML = [1, 2, 3, 4, 5, 6, 0].map(d => {
    const [o, c] = CONFIG.hours[d];
    return `<li class="${d === today ? 'today' : ''}"><span>${T.days[L][d]}</span><span>${hh(o)} – ${hh(c)}</span></li>`;
  }).join('');
  updateStatus(); updateCart();
}
const hh = h => String(h % 24).padStart(2, '0') + ':00';

function updateStatus() {
  const now = new Date(), d = now.getDay(), h = now.getHours() + now.getMinutes() / 60;
  const [o, c] = CONFIG.hours[d], [, pc] = CONFIG.hours[(d + 6) % 7];
  const isOpen = (h >= o && h < c) || (pc > 24 && h < pc - 24);
  $('#status').classList.toggle('open', isOpen);
  $('#statusText').textContent = isOpen ? t('open', { t: hh(h < o ? pc : c) }) : t('closed', { t: hh(h < o ? o : CONFIG.hours[(d + 1) % 7][0]) });
}

function lines() {
  return MENU.flatMap(c => c.items).filter(it => cart[it.id]).map(it => ({ it, n: cart[it.id], sum: it.price * cart[it.id] }));
}
function updateCart() {
  const ls = lines(), count = ls.reduce((a, l) => a + l.n, 0), total = ls.reduce((a, l) => a + l.sum, 0);
  $('#cartbar').classList.toggle('show', count > 0);
  $('#cartCount').textContent = t('items', { n: count });
  $('#cartTotal').textContent = money(total);
  $('#lines').innerHTML = ls.map(l => `<li><span><span class="n">${l.n}×</span> ${l.it.name[L]}</span><span>${money(l.sum)}</span></li>`).join('');
  $('#sheetTotal').textContent = money(total);
  if (!count) closeSheet();
  return total;
}

// Events
$$('.langs button').forEach((b, i) => b.onclick = () => { L = i; try { localStorage.setItem('lang', LANGS[i]); } catch {} render(); });
$('#menuList').addEventListener('click', e => {
  const btn = e.target.closest('button'); if (!btn) return;
  const q = btn.closest('.qty'), id = q.dataset.id;
  cart[id] = Math.max(0, (cart[id] || 0) + (btn.classList.contains('plus') ? 1 : -1));
  if (!cart[id]) delete cart[id];
  q.querySelector('output').textContent = cart[id] || 0;
  q.querySelector('output').hidden = q.querySelector('.minus').hidden = !cart[id];
  updateCart();
});
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.getElementById('cat-' + b.dataset.cat).scrollIntoView({ behavior: 'smooth' });
});
// Highlight the tab for the category in view
const io = new IntersectionObserver(es => es.forEach(en => {
  if (en.isIntersecting) $$('#tabs button').forEach(b => b.classList.toggle('on', 'cat-' + b.dataset.cat === en.target.id));
}), { rootMargin: '-150px 0px -60% 0px' });
const observeCats = () => $$('.cat').forEach(c => io.observe(c));

const openSheet = () => { $('#sheet').classList.add('show'); $('#sheetBg').classList.add('show'); };
const closeSheet = () => { $('#sheet').classList.remove('show'); $('#sheetBg').classList.remove('show'); };
$('#openCart').onclick = openSheet; $('#closeSheet').onclick = closeSheet; $('#sheetBg').onclick = closeSheet;
$('#mode').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  mode = b.dataset.m; $$('#mode button').forEach(x => x.classList.toggle('on', x === b));
  $('#addrWrap').hidden = mode === 'pickup';
};
$('#sendWa').onclick = () => {
  const total = updateCart();
  if (mode === 'delivery' && total < CONFIG.minOrder) return alert(t('minOrder', { m: money(CONFIG.minOrder) }));
  if (mode === 'delivery' && !$('#address').value.trim()) return alert(t('needAddr'));
  const name = $('#name').value.trim(), note = $('#note').value.trim();
  const msg = [t('waHello'), '', ...lines().map(l => `• ${l.n}× ${l.it.name[L]} - ${money(l.sum)}`), '',
    `${t('total')}: ${money(total)}`, T[mode][L],
    name ? `${t('waName')}: ${name}` : null,
    mode === 'delivery' ? `${t('waAddr')}: ${$('#address').value.trim()}` : null,
    note ? `${t('waNote')}: ${note}` : null].filter(x => x !== null).join('\n');
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`, '_blank');
};

// Static links
$('#callBtn').href = 'tel:' + CONFIG.phone;
const dir = `https://www.google.com/maps/dir/?api=1&destination=${CONFIG.lat},${CONFIG.lon}`;
$('#dirBtn').href = $('#dirBtn2').href = dir;
$('#addr').textContent = CONFIG.address;
$('#mapFrame').src = `https://maps.google.com/maps?q=${CONFIG.lat},${CONFIG.lon}&z=16&output=embed`;
$('#yr').textContent = new Date().getFullYear();
addEventListener('scroll', () => $('#top').classList.toggle('solid', scrollY > 40), { passive: true });

render(); observeCats();
// re-observe after language change re-renders the menu
$$('.langs button').forEach(b => b.addEventListener('click', observeCats));
setInterval(updateStatus, 60000);
</script>
